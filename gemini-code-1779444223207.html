<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Video Player</title>
    <style>
        /* Menggunakan font modern dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Background estetik dengan gradasi dan elemen abstrak */
        body {
            background: radial-gradient(circle at top right, #2c1654, #0b0914);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Efek lampu neon di latar belakang */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: #7928ca;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.3;
            top: 20%;
            left: 15%;
            z-index: -1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* Container Video Utama (Glassmorphism) */
        .video-wrapper {
            position: relative;
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(121, 40, 202, 0.2);
        }

        /* Desain Frame Video */
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Tombol Kontrol Kustom yang Minimalis */
        .custom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            padding: 0 10px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: #ffffff;
            color: #0b0914;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .control-btn:active {
            transform: scale(0.98);
        }

        /* Variasi tombol untuk efek warna */
        .btn-primary {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(45deg, #ff2a93, #8a3fd7);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Cinematic Space</h1>
        <p>Nikmati pengalaman visual dengan pemutar video minimalis</p>
    </header>

    <div class="video-wrapper">
        <div class="video-container">
            <!-- Contoh video alam estetik (bisa diganti dengan video milikmu) -->
            <!-- Atribut poster untuk gambar sebelum video di-play -->
            <video id="player" poster="https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1000">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1611-large.mp4" type="video/mp4">
                Browser kamu tidak mendukung pemutar video ini.
            </video>
        </div>

        <!-- Tombol kontrol interaktif kustom -->
        <div class="custom-controls">
            <button class="control-btn btn-primary" onclick="togglePlay()">Play / Pause</button>
            <button class="control-btn" onclick="toggleMute()">Mute / Unmute</button>
            <button class="control-btn" onclick="restartVideo()">Restart</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('player');

        // Fungsi Play & Pause
        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        // Fungsi Suara (Mute/Unmute)
        function toggleMute() {
            video.muted = !video.muted;
        }

        // Fungsi Mengulang dari Awal
        function restartVideo() {
            video.currentTime = 0;
            video.play();
        }

        // Opsional: Klik langsung pada video untuk Play/Pause
        video.addEventListener('click', togglePlay);
    </script>

</body>
</html>
